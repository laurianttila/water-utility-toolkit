<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ohjelmiston riski- ja toimittaja-arviointi</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-bg: #eff6ff;
      --accent-border: #bfdbfe;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --warning-text: #b45309;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 720px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      border: 1px solid var(--border);
    }

    .logo-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 24px auto;
  max-width: 180px;
  width: 100%;
}

.logo-img {
  width: 100%;
  height: auto;
  max-height: 80px;
  object-fit: contain;
  display: block;
}

@media (max-width: 480px) {
  .logo-container {
    max-width: 140px;
    margin-bottom: 18px;
  }
  .logo-img {
    max-height: 60px;
  }
}

    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 32px;
      position: relative;
    }

    .progress-bar::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background-color: var(--border);
      transform: translateY(-50%);
      z-index: 1;
    }

    .progress-line {
      position: absolute;
      top: 50%;
      left: 0;
      height: 4px;
      background-color: var(--primary);
      transform: translateY(-50%);
      z-index: 1;
      transition: width 0.3s ease;
      width: 0%;
    }

    .step-indicator {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 2;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .step-indicator:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: scale(1.05);
    }

    .step-indicator.active {
      border-color: var(--primary);
      background-color: var(--primary);
      color: white;
    }

    .step-indicator.completed {
      border-color: var(--primary);
      background-color: var(--accent-bg);
      color: var(--primary);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
      text-align: center;
    }

    p.intro-text {
      color: var(--text-muted);
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .field-group {
      margin-bottom: 24px;
    }

    .field-label {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .field-hint {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    input.text-input, textarea.text-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea.text-input {
      min-height: 90px;
      resize: vertical;
    }

    input.text-input:focus, textarea.text-input:focus {
      border-color: var(--primary);
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .option-card:hover {
      border-color: var(--accent-border);
      background-color: var(--accent-bg);
    }

    .option-card.selected {
      border-color: var(--primary);
      background-color: var(--accent-bg);
    }

    .option-card input[type="radio"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--primary);
    }

    .option-content label {
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin-bottom: 2px;
    }

    .option-content span {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .info-box {
      background-color: var(--accent-bg);
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .info-box.warning {
      background-color: var(--warning-bg);
      border-left-color: var(--warning-text);
    }

    .info-box.danger {
      background-color: var(--danger-bg);
      border-left-color: var(--danger-text);
    }

    .info-box h4 {
      color: var(--primary);
      margin-bottom: 4px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-box.warning h4 { color: var(--warning-text); }
    .info-box.danger h4 { color: var(--danger-text); }

    .report-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background-color: var(--bg);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .report-meta-item strong {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .report-meta-item span, .report-meta-item input {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .report-meta-item input.date-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--text-muted);
      font-family: inherit;
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .report-section {
      margin-bottom: 28px;
    }

    .report-section h3 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.9rem;
    }

    .report-table th {
      background-color: var(--bg);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .badge-pass { background-color: #dcfce7; color: #15803d; }
    .badge-warn { background-color: #fef3c7; color: #b45309; }
    .badge-fail { background-color: #fee2e2; color: #b91c1c; }
    .badge-soft { background-color: #f1f5f9; color: #475569; }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      width: auto;
    }

    .btn-secondary:hover {
      background-color: var(--bg);
      color: var(--text);
    }

    .btn-danger-outline {
      background-color: transparent;
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      width: auto;
    }

    .btn-danger-outline:hover {
      background-color: var(--danger-bg);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .hidden { display: none !important; }

    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .container { box-shadow: none !important; border: none !important; max-width: 100% !important; padding: 0 !important; }
      .progress-bar, .nav-actions, #start-btn, .no-print { display: none !important; }
      .info-box { border-left-width: 3px !important; background-color: #f8fafc !important; break-inside: avoid; }
      .report-section { break-inside: avoid; }
      input.date-input { border-bottom: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Screen 1: Welcome/Intro -->
    <div id="screen-intro">
      <div class="logo-container">
        <img src="logo.png" alt="Utility Logo" class="logo-img">
      </div>
      <h1>Ohjelmiston valinnan arviointityökalu</h1>
      <p class="intro-text">
        Tämä ohjattu työkalu auttaa arvioimaan ohjelmistotarpeita, tunnistamaan toiminnallisia ja tietoturvariskejä sekä laatimaan raportin sisäistä riskienhallintaa varten.
      </p>
      <button class="btn" id="start-btn">Aloita arviointi</button>
    </div>

    <!-- Dynamic Wizard Screens -->
    <div id="screen-wizard" class="hidden">
      <div class="progress-bar">
        <div class="progress-line" id="progress-line"></div>
        <div class="step-indicator active" data-step="1" title="Siirry vaiheeseen 1: Tarve">1</div>
        <div class="step-indicator" data-step="2" title="Siirry vaiheeseen 2: Toimittaja">2</div>
        <div class="step-indicator" data-step="3" title="Siirry vaiheeseen 3: Tietoturva">3</div>
        <div class="step-indicator" data-step="4" title="Siirry vaiheeseen 4: Sopimus">4</div>
        <div class="step-indicator" data-step="5" title="Siirry vaiheeseen 5: Raportti">5</div>
      </div>

      <div id="wizard-content"></div>

      <div class="nav-actions">
        <button class="btn btn-secondary hidden" id="back-btn">Takaisin</button>
        <button class="btn btn-danger-outline" id="reset-btn">Tyhjennä ja aloita alusta</button>
        <button class="btn" id="next-btn" disabled style="flex-grow: 1;">Seuraava vaihe</button>
      </div>
    </div>
  </div>

  <script>
    function createInitialState() {
      return {
        evaluationDate: new Date().toLocaleDateString('fi-FI', { year: 'numeric', month: 'long', day: 'numeric' }),
        problemStatement: '',
        isCoreSystem: null,
        vendorName: '',
        hasNamedContact: null,
        vendorDisappearanceRisk: null,
        serviceLevel: null,
        hasSecurityProof: null,
        allowsDataPortability: null,
        deploymentModel: null,
        isActivelyMaintained: null,
        isDataEncrypted: null,
        hasMfaSupport: null,
        isRemoteAccessSecure: null,
        hasActivityLogs: null,
        hasDisasterRecoveryPlan: null,
        hasRoleBasedAccess: null,
        contractHasSla: null,
        contractHasPatchingProcess: null,
        contractHasCveTimelines: null,
        contractHasOffsiteBackups: null,
        contractHasDisasterSupport: null,
        contractHasDataExport: null,
        contractHasTerminationTerms: null
      };
    }

    const state = {
      currentStep: 1,
      totalSteps: 5,
      data: createInitialState()
    };

    const savedState = localStorage.getItem('software_wizard_data');
    if (savedState) {
      Object.assign(state.data, JSON.parse(savedState));
    }

    function persistData() {
      localStorage.setItem('software_wizard_data', JSON.stringify(state.data));
    }

    const screenIntro = document.getElementById('screen-intro');
    const screenWizard = document.getElementById('screen-wizard');
    const startBtn = document.getElementById('start-btn');
    const backBtn = document.getElementById('back-btn');
    const resetBtn = document.getElementById('reset-btn');
    const nextBtn = document.getElementById('next-btn');
    const wizardContent = document.getElementById('wizard-content');
    const progressLine = document.getElementById('progress-line');

    startBtn.addEventListener('click', () => {
      screenIntro.classList.add('hidden');
      screenWizard.classList.remove('hidden');
      renderStep(state.currentStep);
    });

    backBtn.addEventListener('click', () => {
      if (state.currentStep > 1) {
        state.currentStep--;
        renderStep(state.currentStep);
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Haluatko varmasti tyhjentää kaikki vastaukset ja aloittaa uuden arvioinnin?')) {
        localStorage.removeItem('software_wizard_data');
        state.data = createInitialState();
        state.currentStep = 1;
        renderStep(1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (state.currentStep < state.totalSteps) {
        state.currentStep++;
        renderStep(state.currentStep);
      } else if (state.currentStep === state.totalSteps) {
        window.print();
      }
    });

    document.querySelectorAll('.step-indicator').forEach(indicator => {
      indicator.addEventListener('click', (e) => {
        const targetStep = parseInt(e.currentTarget.dataset.step);
        if (targetStep !== state.currentStep) {
          state.currentStep = targetStep;
          renderStep(state.currentStep);
        }
      });
    });

    function updateProgress() {
      const indicators = document.querySelectorAll('.step-indicator');
      indicators.forEach(ind => {
        const stepNum = parseInt(ind.dataset.step);
        if (stepNum === state.currentStep) {
          ind.className = 'step-indicator active';
        } else if (isStepComplete(stepNum)) {
          ind.className = 'step-indicator completed';
        } else {
          ind.className = 'step-indicator';
        }
      });

      const percentage = ((state.currentStep - 1) / (state.totalSteps - 1)) * 100;
      progressLine.style.width = percentage + '%';
      backBtn.classList.toggle('hidden', state.currentStep === 1);
    }

    function isStepComplete(step) {
      if (step === 1) return state.data.isCoreSystem !== null;
      if (step === 2) {
        return state.data.hasNamedContact !== null &&
               state.data.vendorDisappearanceRisk !== null &&
               state.data.serviceLevel !== null &&
               state.data.hasSecurityProof !== null &&
               state.data.allowsDataPortability !== null;
      }
      if (step === 3) {
        return state.data.deploymentModel !== null &&
               state.data.isActivelyMaintained !== null &&
               state.data.isDataEncrypted !== null &&
               state.data.hasMfaSupport !== null &&
               state.data.isRemoteAccessSecure !== null &&
               state.data.hasActivityLogs !== null &&
               state.data.hasDisasterRecoveryPlan !== null &&
               state.data.hasRoleBasedAccess !== null;
      }
      if (step === 4) {
        return state.data.contractHasSla !== null &&
               state.data.contractHasPatchingProcess !== null &&
               state.data.contractHasCveTimelines !== null &&
               state.data.contractHasOffsiteBackups !== null &&
               state.data.contractHasDisasterSupport !== null &&
               state.data.contractHasDataExport !== null &&
               state.data.contractHasTerminationTerms !== null;
      }
      return true;
    }

    function renderStep(step) {
      updateProgress();
      wizardContent.innerHTML = '';

      if (step === 1) renderScreen2();
      else if (step === 2) renderScreen3();
      else if (step === 3) renderScreen4();
      else if (step === 4) renderScreen5();
      else if (step === 5) renderScreen6();
    }

    // --- SCREEN 2: Problem & Core System ---
    function renderScreen2() {
      const template = `
        <h2 class="section-title">1. Tarpeen arviointi</h2>
        
        <div class="field-group">
          <label class="field-label" for="problem-input">Minkä ongelman tai tarpeen haluat ratkaista?</label>
          <div class="field-hint">Kuvaa lyhyesti, mitä haluat ohjelmiston mahdollistavan vesihuoltolaitoksessasi.</div>
          <textarea id="problem-input" class="text-input" placeholder="esim. asiakaslaskutuksen, vedenlaadun raportoinnin tai pumppujen huollon seurannan automatisointi...">${state.data.problemStatement}</textarea>
        </div>

        <div class="field-group">
          <label class="field-label">Liittyykö ohjelmisto organisaation ydintoimintaan?</label>
          <div class="options-group">
            <div class="option-card ${state.data.isCoreSystem === true ? 'selected' : ''}" onclick="selectCoreOption(true)">
              <input type="radio" name="core-system" ${state.data.isCoreSystem === true ? 'checked' : ''}>
              <div class="option-content"><label>Kyllä, ydintoiminnan järjestelmä</label><span>Ohjelmiston häiriöllä olisi merkittävä vaikutus vesihuoltolaitoksen toimintaan.</span></div>
            </div>
            <div class="option-card ${state.data.isCoreSystem === false ? 'selected' : ''}" onclick="selectCoreOption(false)">
              <input type="radio" name="core-system" ${state.data.isCoreSystem === false ? 'checked' : ''}>
              <div class="option-content"><label>Ei, ei-kriittinen tai kokeiluluonteinen tarve</label><span>Vähäinen välitön vaikutus vesihuollon toimintaan.</span></div>
            </div>
          </div>
        </div>
        <div id="info-box-container"></div>
      `;

      wizardContent.innerHTML = template;

      document.getElementById('problem-input').addEventListener('input', (e) => {
        state.data.problemStatement = e.target.value;
        persistData();
      });

      if (state.data.isCoreSystem !== null) updateCoreFeedback(state.data.isCoreSystem);
      else nextBtn.disabled = true;
    }

    window.selectCoreOption = function(isCore) {
      state.data.isCoreSystem = isCore;
      persistData();
      renderScreen2();
    };

    function updateCoreFeedback(isCore) {
      const container = document.getElementById('info-box-container');
      nextBtn.disabled = false;
      if (isCore) {
        container.innerHTML = `<div class="info-box"><h4>Ydintoiminnan järjestelmän ohje</h4><p>Koska järjestelmä on kriittinen ydintoiminnalle, suositellaan perusteellista toimittajan arviointia, tietoturvatarkastuksia ja toiminnan jatkuvuutta koskevia takeita.</p></div>`;
        nextBtn.textContent = 'Seuraava: Toimittajan arviointi';
        nextBtn.onclick = null;
      } else {
        container.innerHTML = `
          <div class="info-box warning">
            <h4>Huomioitavaa: Ei-kriittisen työkalun riskit</h4>
            <p><strong>Arvioinnin jatkaminen on tässä vapaaehtoista, mutta huomioi seuraavat keskeiset toiminnalliset ja verkkoriskit:</strong></p>
            <ul style="margin-left: 20px; margin-top: 6px; font-size: 0.88rem;">
              <li><strong>Ylläpitovelka:</strong> Jokainen uusi ohjelmistotyökalu, myös pieni, lisää jatkuvaa hallinnollista työtä, kuten salasanojen palautuksia, päivityksiä ja laskutusta. Useat pienet työkalut voivat yhdessä muodostaa merkittävän ylläpitotaakan.</li>
              <li><strong>Osaamisen keskittyminen:</strong> Varmista, että useampi kuin yksi työntekijä osaa käyttää, määrittää ja ylläpitää ohjelmistoa. Jos ainoa osaaja lähtee, ylläpitämättömästä työkalusta voi jäädä käytöstä unohtunut "haamujärjestelmä".</li>
              <li><strong>Verkossa leviämisen ja välietappina toimimisen riski:</strong> Jos tämä ei-kriittinen työkalu asennetaan vesihuoltolaitoksen kannettaville tai yhdistetään toimiston tietokoneisiin tai palvelimiin, hyökkääjä voi vaarannetun laitteen kautta siirtyä esimerkiksi laskutus- tai SCADA-verkkoihin. Pelkästään toimittajan pilvessä toimiva selainpohjainen työkalu välttää tämän paikallisverkon riskin.</li>
            </ul>
          </div>
          <div style="margin-top:16px; display:flex; gap:10px;">
            <button class="btn btn-secondary" style="font-size:0.9rem; padding:10px 16px;" onclick="jumpToSummary()">Siirry suoraan yhteenvetoraporttiin</button>
          </div>
        `;
        nextBtn.textContent = 'Jatka vapaaehtoista arviointia';
      }
    }

    window.jumpToSummary = function() {
      state.currentStep = 5;
      renderStep(5);
    };

    // --- SCREEN 3: Vendor Evaluation ---
    function renderScreen3() {
      const template = `
        <h2 class="section-title">2. Toimittajan ja tuen arviointi</h2>

        <div class="field-group">
          <label class="field-label" for="vendor-name-input">Toimittajan tai yrityksen nimi</label>
          <input type="text" id="vendor-name-input" class="text-input" placeholder="esim. HydroTech Systems Oy" value="${state.data.vendorName}">
        </div>

        <div class="field-group">
          <label class="field-label">Onko käytössä nimetty tukihenkilö?</label>
          <div class="options-group">
            <div class="option-card ${state.data.hasNamedContact === true ? 'selected' : ''}" onclick="selectVendorOption('hasNamedContact', true)">
              <input type="radio" name="c-opt" ${state.data.hasNamedContact === true ? 'checked' : ''}>
              <div class="option-content"><label>Kyllä</label><span>Vesihuoltolaitokselle on nimetty tietty asiakasvastaava tai asiantuntija.</span></div>
            </div>
            <div class="option-card ${state.data.hasNamedContact === false ? 'selected' : ''}" onclick="selectVendorOption('hasNamedContact', false)">
              <input type="radio" name="c-opt" ${state.data.hasNamedContact === false ? 'checked' : ''}>
              <div class="option-content"><label>Ei</label><span>Tuki hoidetaan yleisen helpdesk-palvelun ja tukipyyntöjonon kautta.</span></div>
            </div>
          </div>
          <div id="contact-feedback"></div>
        </div>

        <div class="field-group">
          <label class="field-label">Onko riski, että toimittaja lopettaa toimintansa tai ohjelmiston tukemisen suunnitellun käyttöajan aikana?</label>
          <div class="options-group">
            <div class="option-card ${state.data.vendorDisappearanceRisk === true ? 'selected' : ''}" onclick="selectVendorOption('vendorDisappearanceRisk', true)">
              <input type="radio" name="r-opt" ${state.data.vendorDisappearanceRisk === true ? 'checked' : ''}>

            <h3>Ohjelmiston tietoturvan ja elinkelpoisuuden hallintatoimet</h3>
            <div class="info-box warning">
              <h4>Tekniset suojatoimet (${softwareRisks.length} havaintoa)</h4>
              <p>Tekniset puutteet voivat vaarantaa asiakastiedot tai sisäiset järjestelmät, jos niitä ei korjata.</p>
              <p style="margin-top:8px;"><strong>Suositellut toimenpiteet:</strong> Edellytä, että toimittaja korjaa kriittiset tietoturvapuutteet ennen käyttöönottoa, suojaa ohjelmiston käyttö organisaation VPN:n tai palomuurin taakse, käytä vahvaa SSO-tunnistautumista, jos ohjelmiston oma MFA puuttuu, tai harkitse aktiivisesti ylläpidettyä vaihtoehtoista ohjelmistoa.</p>
            </div>
          </div>
        ` : ''}

        <!-- Contractual Risks Section -->
        <div class="report-section">
          <h3>Tunnistetut sopimuspuutteet (${contractRisks.length})</h3>
          ${contractRisks.length === 0 ? '<p style="font-size:0.9rem; color:#15803d;">Arvioinnissa ei havaittu merkittäviä puuttuvia sopimusehtoja.</p>' : ''}
          ${contractRisks.map(r => `
            <div class="info-box ${isNonCritical ? 'warning' : 'danger'}">
              <h4>${r.title}</h4>
              <p>${r.text}</p>
            </div>
          `).join('')}
        </div>

        ${contractRisks.length > 0 ? `
          <div class="report-section">
            <h3>Sopimusehtojen parantamisen keinot</h3>
            <div class="info-box warning">
              <h4>Sopimukselliset suojatoimet (${contractRisks.length} puutetta)</h4>
              <p>Tavanomaiset sopimussuojat (SLA:t, haavoittuvuuksien korjausajat ja sopimuksen päättämisehdot) ovat puutteellisia tai puuttuvat toimittajan asiakirjoista.</p>
              <p style="margin-top:8px;"><strong>Suositus:</strong> Pyydä ennen sopimuksen allekirjoittamista kirjalliset muutokset, joihin sisältyvät sitovat SLA-ehdot ja tietojen vientitakuu sopimuksen päättyessä. Jos yksilöllisten ehtojen neuvottelu on pienelle ostajalle vaikeaa, harkitse yhteishankintaa muiden vesihuoltolaitosten kanssa neuvotteluaseman vahvistamiseksi.</p>
            </div>
          </div>
        ` : ''}

        <div class="report-section">
          <h3>Arvioinnin yksityiskohtainen tarkistuslista</h3>
          <table class="report-table">
            <thead>
              <tr>
                <th>Arviointikriteeri</th>
                <th>Tila</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Käyttöönottoarkkitehtuuri</td><td>${state.data.deploymentModel === 'cloud' ? '<span class="status-badge badge-pass">Toimittajan verkkopalvelu</span>' : '<span class="status-badge badge-warn">Paikallinen laite / verkkoon yhdistetty palvelin</span>'}</td></tr>
              <tr><td>Nimetty tukihenkilö</td><td>${state.data.hasNamedContact ? '<span class="status-badge badge-pass">Kyllä</span>' : (isNonCritical ? '<span class="status-badge badge-soft">Vapaaehtoinen huomio</span>' : '<span class="status-badge badge-warn">Ei</span>')}</td></tr>
              <tr><td>Palvelutaso</td><td><span class="status-badge badge-pass">${state.data.serviceLevel === 'best_effort' ? 'Parhaan kykynsä mukaan (24–48 h)' : state.data.serviceLevel === 'business_hours' ? 'Taattu tuki työaikana' : state.data.serviceLevel === '24_7' ? '24/7-hätätilannetuki' : 'Ei määritelty'}</span></td></tr>
              <tr><td>Näyttö tietoturvakäytännöistä</td><td>${state.data.hasSecurityProof ? '<span class="status-badge badge-pass">Toimitettu</span>' : (isNonCritical ? '<span class="status-badge badge-soft">Varmistamaton</span>' : '<span class="status-badge badge-fail">Puuttuu</span>')}</td></tr>
              <tr><td>Tietojen vientimahdollisuus</td><td>${state.data.allowsDataPortability ? '<span class="status-badge badge-pass">Tuettu</span>' : (isNonCritical ? '<span class="status-badge badge-warn">Lukittu</span>' : '<span class="status-badge badge-fail">Lukittu</span>')}</td></tr>
              <tr><td>Ohjelmiston aktiivinen ylläpito</td><td>${state.data.isActivelyMaintained ? '<span class="status-badge badge-pass">Ylläpidetty</span>' : (isNonCritical ? '<span class="status-badge badge-warn">Ei ylläpidetty</span>' : '<span class="status-badge badge-fail">Ei ylläpidetty</span>')}</td></tr>
              <tr><td>Tietojen salaus (siirrossa ja tallennettuna)</td><td>${state.data.isDataEncrypted ? '<span class="status-badge badge-pass">Salattu</span>' : (isNonCritical ? '<span class="status-badge badge-warn">Salaamaton</span>' : '<span class="status-badge badge-fail">Salaamaton</span>')}</td></tr>
              <tr><td>Monivaiheinen tunnistautuminen (MFA)</td><td>${state.data.hasMfaSupport ? '<span class="status-badge badge-pass">Tuettu</span>' : (isNonCritical ? '<span class="status-badge badge-soft">Vain salasana</span>' : '<span class="status-badge badge-fail">Puuttuu</span>')}</td></tr>
              <tr><td>Suojattu etäkäyttö</td><td>${state.data.isRemoteAccessSecure ? '<span class="status-badge badge-pass">Suojattu</span>' : (isNonCritical ? '<span class="status-badge badge-warn">Suojaamaton</span>' : '<span class="status-badge badge-fail">Suojaamaton</span>')}</td></tr>
              <tr><td>Auditointijälki / toimintalokit</td><td>${state.data.hasActivityLogs ? '<span class="status-badge badge-pass">Saatavilla</span>' : '<span class="status-badge badge-soft">Puuttuu</span>'}</td></tr>
              <tr><td>Kirjallinen SLA sopimuksessa</td><td>${state.data.contractHasSla ? '<span class="status-badge badge-pass">Sopimuksessa</span>' : (isNonCritical ? '<span class="status-badge badge-soft">Ei SLA:ta</span>' : '<span class="status-badge badge-fail">Puuttuu</span>')}</td></tr>
              <tr><td>Sopimuksen päättämis- ja käyttöoikeuksien poistamisehdot</td><td>${state.data.contractHasTerminationTerms ? '<span class="status-badge badge-pass">Määritelty</span>' : (isNonCritical ? '<span class="status-badge badge-soft">Määrittelemätön</span>' : '<span class="status-badge badge-fail">Määrittelemätön</span>')}</td></tr>
            </tbody>
          </table>
        </div>
      `;

      wizardContent.innerHTML = template;

      document.getElementById('eval-date-input').addEventListener('input', (e) => {
        state.data.evaluationDate = e.target.value;
        persistData();
      });

      nextBtn.disabled = false;
      nextBtn.textContent = 'Tulosta / tallenna raportti (PDF)';
    }
  </script>
</body>
</html>
